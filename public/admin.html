<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | JMW Chromebook</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#f1f5f9;color:#172033;min-height:100vh;display:grid;place-items:center}.box{width:min(430px,calc(100% - 36px));background:#fff;padding:30px;border-radius:22px;box-shadow:0 18px 50px #0f172a18}input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0;border:1px solid #dbe3ec;border-radius:10px;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#0f172a;color:#fff;font-weight:800;margin-top:10px;cursor:pointer}.back{display:block;text-align:center;margin-top:16px;color:#475569;text-decoration:none;font-size:14px}#error{color:#b91c1c;margin-top:10px}</style></head><body><div class="box"><div style="font-size:13px;color:#64748b">JMW Chromebook Manager</div><h1>เข้าสู่ระบบผู้ดูแล</h1><form id="loginForm"><input id="username" placeholder="ชื่อผู้ใช้" required><input id="password" type="password" placeholder="รหัสผ่าน" required><button>เข้าสู่ระบบ</button><div id="error"></div></form><a class="back" href="/">← กลับหน้าแจ้งซ่อม</a></div><script>const form=document.getElementById('loginForm');const error=document.getElementById('error');form.onsubmit=async e=>{e.preventDefault();error.textContent='กำลังเข้าสู่ระบบ...';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);localStorage.setItem('jmw_token',d.token);location.href='/dashboard.html'}catch(x){error.textContent=x.message}}</script></body></html>
