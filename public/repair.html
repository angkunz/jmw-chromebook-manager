<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>แจ้งซ่อม Chromebook | JMW</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f7fb}.repair-card{width:min(680px,calc(100% - 32px));background:#fff;padding:32px;border-radius:20px;box-shadow:0 15px 45px #0001}.repair-card h1{margin-top:0}.repair-card form{display:grid;gap:14px}.repair-card label{font-weight:600}.repair-card input,.repair-card select,.repair-card textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dee9;border-radius:10px;font:inherit}.repair-card textarea{min-height:120px}.repair-card button{padding:13px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;font-weight:600}.back{display:inline-block;margin-bottom:18px}</style></head><body><main class="repair-card"><a class="back" href="/">← กลับหน้าหลัก</a><h1>แจ้งซ่อม Chromebook</h1><p>สำหรับนักเรียนและบุคลากร สามารถแจ้งซ่อมได้โดยไม่ต้องเข้าสู่ระบบ</p><form id="form"><label>เครื่อง <select id="device_id" required><option value="">กำลังโหลด...</option></select></label><label>ชื่อผู้แจ้ง <input id="reporter_name" required placeholder="ชื่อ-นามสกุล"></label><label>อีเมล <input id="reporter_email" type="email" placeholder="สำหรับรับการติดต่อกลับ"></label><label>อาการ/ปัญหา <input id="issue" required placeholder="เช่น เปิดไม่ติด, หน้าจอแตก"></label><label>รายละเอียดเพิ่มเติม <textarea id="details" placeholder="อธิบายอาการเพิ่มเติม"></textarea></label><button>ส่งแจ้งซ่อม</button></form><div id="msg" class="msg"></div></main><script>const sel=document.getElementById('device_id'),msg=document.getElementById('msg');fetch('/api/public/devices').then(r=>r.json()).then(ds=>{sel.innerHTML='<option value="">-- เลือกเครื่อง --</option>'+ds.map(d=>`<option value="${d.id}">${d.asset_code} · ${d.serial_number} · ${d.brand} ${d.model}</option>`).join('')}).catch(()=>sel.innerHTML='<option>โหลดข้อมูลไม่สำเร็จ</option>');document.getElementById('form').onsubmit=async e=>{e.preventDefault();msg.textContent='กำลังส่ง...';const body={device_id:Number(sel.value),reporter_name:reporter_name.value,reporter_email:reporter_email.value,issue:issue.value,details:details.value};try{const r=await fetch('/api/public/repair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'ไม่สำเร็จ');msg.textContent=d.message+' เลขที่แจ้งซ่อม #'+d.repair.id;e.target.reset()}catch(err){msg.textContent='ไม่สำเร็จ: '+err.message}}</script></body></html>
