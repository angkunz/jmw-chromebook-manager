<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>แจ้งซ่อม Chromebook | JMW</title><link rel="stylesheet" href="style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#f4f7fb}.repair-card{width:min(680px,calc(100% - 32px));background:#fff;padding:32px;border-radius:20px;box-shadow:0 15px 45px #0001}.repair-card h1{margin-top:0}.repair-card form{display:grid;gap:14px}.repair-card label{font-weight:600}.repair-card input,.repair-card select,.repair-card textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8dee9;border-radius:10px;font:inherit}.repair-card textarea{min-height:120px}.repair-card button{padding:13px;border:0;border-radius:10px;background:#1769e0;color:#fff;font-weight:700;cursor:pointer}.msg{margin-top:12px;font-weight:600}.back{display:inline-block;margin-bottom:18px}.ok{color:#166534}.err{color:#b91c1c}</style></head><body><main class="repair-card"><a class="back" href="/">← กลับหน้าหลัก</a><h1>แจ้งซ่อม Chromebook</h1><p>สำหรับนักเรียนและบุคลากร สามารถแจ้งซ่อมได้โดยไม่ต้องเข้าสู่ระบบ</p><form id="repairForm"><label for="device_id">เครื่อง Chromebook<select id="device_id" name="device_id" required><option value="">กำลังโหลด...</option></select></label><label for="reporter_name">ชื่อผู้แจ้ง<input id="reporter_name" name="reporter_name" required placeholder="ชื่อ-นามสกุล"></label><label for="reporter_email">อีเมล<input id="reporter_email" name="reporter_email" type="email" placeholder="สำหรับรับการติดต่อกลับ"></label><label for="issue">อาการ/ปัญหา<input id="issue" name="issue" required placeholder="เช่น เปิดไม่ติด, หน้าจอแตก"></label><label for="details">รายละเอียดเพิ่มเติม<textarea id="details" name="details" placeholder="อธิบายอาการเพิ่มเติม"></textarea></label><button type="submit">ส่งแจ้งซ่อม</button></form><div id="msg" class="msg" aria-live="polite"></div></main><script>const form=document.getElementById('repairForm');const sel=document.getElementById('device_id');const msg=document.getElementById('msg');async function loadDevices(){try{const r=await fetch('/api/public/devices',{cache:'no-store'});const ds=await r.json();if(!r.ok)throw Error(ds.error||'โหลดรายการเครื่องไม่สำเร็จ');sel.innerHTML='<option value="">-- เลือกเครื่อง --</option>'+ds.map(d=>`<option value="${d.id}">S/N: ${escapeHtml(d.serial_number)} · รหัสเครื่อง: ${escapeHtml(d.asset_code)}</option>`).join('')}catch(e){sel.innerHTML='<option value="">โหลดข้อมูลไม่สำเร็จ</option>';msg.textContent=e.message;msg.className='msg err'}}function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}form.addEventListener('submit',async function(event){event.preventDefault();msg.textContent='กำลังส่ง...';msg.className='msg';const submittedForm=event.currentTarget;const data=Object.fromEntries(new FormData(submittedForm));data.device_id=Number(data.device_id);try{const r=await fetch('/api/public/repairs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),cache:'no-store'});const result=await r.json().catch(()=>({}));if(!r.ok)throw Error(result.error||`HTTP ${r.status}`);msg.textContent=`แจ้งซ่อมเรียบร้อยแล้ว เลขที่แจ้งซ่อม #${result.repair?.id||result.repair_id||'-'}`;msg.className='msg ok';submittedForm.reset();await loadDevices()}catch(e){msg.textContent='ไม่สำเร็จ: '+e.message;msg.className='msg err'}});loadDevices();</script></body></html>
