<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จัดการตรวจสอบ Chromebook | JMW</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:'Noto Sans Thai',sans-serif}.wrap{max-width:1200px;margin:auto;padding:24px}.head{background:linear-gradient(135deg,#172554,#0f766e);color:#fff;border-radius:20px;padding:25px;margin-bottom:16px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;padding:10px 14px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.danger{background:#dc2626}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:750px}th,td{padding:10px;border-bottom:1px solid #e2e8f0;text-align:left}.msg{padding:10px;border-radius:9px;margin-bottom:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><main class="wrap"><div class="head"><div>JATURAMIT WITTAYAKARN SCHOOL</div><h1>จัดการตรวจสอบ Chromebook</h1><div>ตั้งค่ารายการตรวจสอบและดูรายงานประจำเดือน</div></div><div id="msg"></div><section class="card"><h2>รายการตรวจสอบที่แอดมินกำหนด</h2><div class="grid"><input id="itemLabel" placeholder="ชื่อรายการตรวจ เช่น แป้นพิมพ์ปกติ"><input id="itemDescription" placeholder="คำอธิบายเพิ่มเติม"><input id="itemOrder" type="number" placeholder="ลำดับ" value="1"></div><div class="actions" style="margin-top:10px"><button class="btn" id="saveItem">เพิ่มรายการ</button></div><div class="table-wrap"><table><thead><tr><th>ลำดับ</th><th>รายการ</th><th>คำอธิบาย</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody id="items"></tbody></table></div></section><section class="card"><h2>รายงานการตรวจเช็ค</h2><div class="grid"><input id="reportMonth" type="month"><select id="reportRoom"><option value="">ทุกระดับชั้น/ห้อง</option></select><button class="btn" id="loadReports">ค้นหารายงาน</button></div><div class="table-wrap"><table><thead><tr><th>เดือน</th><th>ระดับชั้น/ห้อง</th><th>จำนวนเครื่อง</th><th>รายการตรวจ</th><th>ปกติ</th><th>ไม่ปกติ</th><th>ผู้ตรวจ</th><th>วันที่ตรวจ</th><th>จัดการ</th></tr></thead><tbody id="reports"></tbody></table></div></section><section id="detail" class="card" style="display:none"></section></main><script>const $=id=>document.getElementById(id),token=()=>localStorage.getItem('jmw_token');async function api(action,opt={}){const r=await fetch('/api/device-checks?action='+encodeURIComponent(action),{headers:{'Content-Type':'application/json',Authorization:'Bearer '+token()},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}function msg(t,e=false){$('msg').innerHTML=`<div class="msg" style="background:${e?'#fee2e2':'#dcfce7'};color:${e?'#991b1b':'#166534'}">${t}</div>`}const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function init(){try{const [i,r]=await Promise.all([api('admin-items'),api('rooms')]);renderItems(i.items);$('reportRoom').innerHTML='<option value="">ทุกระดับชั้น/ห้อง</option>'+r.rooms.map(x=>`<option>${esc(x.class_or_department)}</option>`).join('');await reports()}catch(e){if(e.message.includes('401'))location.href='/admin.html';else msg(e.message,true)}}async function renderItems(items){$('items').innerHTML=items.map(x=>`<tr><td>${x.sort_order}</td><td>${esc(x.label)}</td><td>${esc(x.description||'-')}</td><td>${x.active?'ใช้งาน':'ปิดใช้งาน'}</td><td><button class="btn danger" onclick="delItem(${x.id})">ปิดใช้งาน</button></td></tr>`).join('')}$('saveItem').onclick=async()=>{try{await api('admin-item-save',{method:'POST',body:JSON.stringify({label:$('itemLabel').value,description:$('itemDescription').value,sort_order:Number($('itemOrder').value)||1})});$('itemLabel').value='';$('itemDescription').value='';const d=await api('admin-items');renderItems(d.items);msg('บันทึกรายการตรวจแล้ว')}catch(e){msg(e.message,true)}};async function delItem(id){if(!confirm('ปิดใช้งานรายการนี้?'))return;try{await api('admin-item-delete',{method:'POST',body:JSON.stringify({id})});const d=await api('admin-items');renderItems(d.items);msg('ปิดใช้งานรายการแล้ว')}catch(e){msg(e.message,true)}}$('loadReports').onclick=reports;async function reports(){try{let a='admin-reports';const q=[];if($('reportMonth').value)q.push('month='+encodeURIComponent($('reportMonth').value));if($('reportRoom').value)q.push('class_or_department='+encodeURIComponent($('reportRoom').value));const d=await api(a+(q.length?'&'+q.join('&'):''));$('reports').innerHTML=d.reports.map(x=>`<tr><td>${esc(x.check_month)}</td><td>${esc(x.class_or_department)}</td><td>${x.device_count}</td><td>${x.total_checks}</td><td>${x.normal_checks}</td><td>${x.abnormal_checks}</td><td>${esc(x.inspector_name)}</td><td>${esc(x.checked_at)}</td><td><div class="actions"><button class="btn" onclick="detail(${x.id})">ดู</button><button class="btn danger" onclick="delReport(${x.id})">ลบ</button></div></td></tr>`).join('')||'<tr><td colspan="9">ไม่พบรายงาน</td></tr>'}catch(e){msg(e.message,true)}}async function detail(id){try{const d=await api('admin-detail&id='+id),r=d.report;let groups={};r.results.forEach(x=>(groups[x.full_name]??=[]).push(x));$('detail').style.display='block';$('detail').innerHTML=`<h2>รายงาน ${esc(String(r.check_month).slice(0,7))} · ${esc(r.class_or_department)}</h2><p>ผู้ตรวจ: ${esc(r.inspector_name)} · ตรวจวันที่ ${esc(r.checked_at)}</p>${Object.entries(groups).map(([n,rows])=>`<div style="border-top:1px solid #e2e8f0;padding:12px 0"><b>${esc(n)}</b> · S/N: ${esc(rows[0]?.serial_number||'-')} · รหัส: ${esc(rows[0]?.asset_code||'-')}<ul>${rows.map(x=>`<li>${esc(x.item_label)} — <b>${x.is_normal?'ปกติ':'ไม่ปกติ'}</b>${x.detail?' · '+esc(x.detail):''}</li>`).join('')}</ul></div>`).join('')}`}catch(e){msg(e.message,true)}}async function delReport(id){if(!confirm('ลบรายงานนี้หรือไม่?'))return;try{await api('admin-delete-report',{method:'POST',body:JSON.stringify({id})});$('detail').style.display='none';await reports();msg('ลบรายงานแล้ว')}catch(e){msg(e.message,true)}}init();</script></body></html>
