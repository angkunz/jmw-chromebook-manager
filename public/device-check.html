<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ตรวจสอบ Chromebook ประจำเดือน | JMW</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f5f8fc;color:#172033;font-family:'Noto Sans Thai',sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.head{background:linear-gradient(135deg,#0f766e,#2563eb);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px}.head h1{margin:5px 0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 8px 24px #0f172a0b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;font-size:14px}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;margin-top:5px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:top}th{background:#f8fafc}.ok{accent-color:#0f766e;transform:scale(1.25)}.bad-detail{display:none;margin-top:7px}.abnormal .bad-detail{display:block}.student{font-weight:800}.sn{font-size:13px;color:#64748b}.btn{border:0;border-radius:11px;padding:12px 18px;background:#0f766e;color:#fff;font:700 15px inherit;cursor:pointer}.btn.secondary{background:#2563eb}.actions{display:flex;gap:10px;flex-wrap:wrap}.signature-area{margin-top:16px}.signature-box{height:120px;border:1.5px solid #64748b;border-radius:8px;background:#fff;position:relative}.signature-box:after{content:'ลงชื่อ ............................................................';position:absolute;left:50%;bottom:18px;transform:translateX(-50%);white-space:nowrap;color:#475569;font-size:14px}.signature-caption{text-align:center;color:#64748b;font-size:13px;margin-top:7px}.msg{padding:10px;border-radius:10px;margin-bottom:12px}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}table{font-size:13px}th,td{padding:9px}.wrap{padding:12px}.head{padding:20px}}@media print{body{background:#fff}.wrap{max-width:none;padding:0}.head{background:#fff;color:#000;border:0;border-radius:0;padding:0 0 12px;box-shadow:none}.card{box-shadow:none;border:1px solid #bbb;border-radius:0;break-inside:avoid}.actions,#msg,#roomInfo{display:none!important}input,select{border:0;padding:0;background:transparent}textarea{border:0}.hidden{display:none}.signature-box{height:130px;border:1px solid #555}.signature-caption{color:#000}table{font-size:11px}th,td{padding:6px}.head h1{font-size:22px}}</style></head><body><main class="wrap"><div class="head"><div>JATURAMIT WITTAYAKARN SCHOOL</div><h1>ตรวจสอบ Chromebook ประจำเดือน</h1><div>สำหรับครู/ผู้รับผิดชอบตรวจสอบอุปกรณ์ประจำห้องเรียน</div></div><div id="msg"></div><section class="card"><div class="grid"><label>เดือน/ปีที่ตรวจ<input id="month" type="month"></label><label>ระดับชั้น/ห้อง<select id="room"><option value="">กำลังโหลดห้อง...</option></select></label></div><p id="roomInfo" style="color:#64748b"></p></section><section id="checkArea" class="hidden"><div class="card"><h2>รายการตรวจสอบ</h2><p>ติ๊ก ✓ = ปกติ · ไม่ติ๊ก = ไม่ปกติ และต้องระบุรายละเอียด</p><div id="tableWrap"></div></div><div class="card"><h2>ผู้ตรวจเช็ค</h2><label>ชื่อผู้ตรวจเช็ค<input id="inspector" placeholder="ชื่อ-นามสกุล"></label><div class="signature-area"><label>ลายเซ็นผู้ตรวจเช็ค</label><div class="signature-box" aria-label="พื้นที่สำหรับลงลายเซ็นด้วยปากกาเมื่อพิมพ์เอกสาร"></div><div class="signature-caption">ลงลายมือชื่อในช่องนี้หลังพิมพ์เอกสาร</div></div></div><div class="actions"><button class="btn" id="save">บันทึกการตรวจสอบ</button><button class="btn secondary" id="print" type="button">พิมพ์ / บันทึก PDF</button></div></section></main><script src="device-check.js"></script></body></html>
